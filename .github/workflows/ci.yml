name: ci

on:
  pull_request:
    branches: ["main"]

env:
  GO_VERSION: "1.27.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Format
        run: gofmt -s -w . && git diff --exit-code

      - name: Mod download
        run: go mod download

      - name: Tidy
        run: go mod tidy && git diff --exit-code

      - name: Mod verify
        run: go mod verify

      - name: Documentation checks
        run: python3 scripts/check-docs.py

      - name: Install Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: |
          while IFS= read -r package; do
            GOMAXPROCS=1 staticcheck "$package"
          done < <(go list ./...)

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test
        run: go test -v -parallel 8 ./...

  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build pinned Rust oracle
        env:
          ORACLE_REVISION: ea39416950cc89496b891fcc8bc75b0b68f0d0fe
        run: |
          rm -rf "$RUNNER_TEMP/fetch-rust-oracle"
          git init "$RUNNER_TEMP/fetch-rust-oracle"
          git -C "$RUNNER_TEMP/fetch-rust-oracle" remote add origin "${{ github.server_url }}/${{ github.repository }}"
          git -C "$RUNNER_TEMP/fetch-rust-oracle" fetch --depth 1 origin "$ORACLE_REVISION"
          git -C "$RUNNER_TEMP/fetch-rust-oracle" checkout --detach FETCH_HEAD
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/fetch-rust-oracle/Cargo.toml"

      - name: Install qualification tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run release qualification and pinned parity
        env:
          FETCH_PARITY_RUST_BINARY: ${{ runner.temp }}/fetch-rust-oracle/target/release/fetch
          FETCH_PARITY_RUST_REVISION: ea39416950cc89496b891fcc8bc75b0b68f0d0fe
        run: scripts/qualify-release.sh --require-parity

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build:
          - linux-amd64
          - linux-arm64
          - darwin-amd64
          - darwin-arm64
          - windows-amd64
          - windows-arm64
        include:
          - build: linux-amd64
            goos: linux
            goarch: amd64
          - build: linux-arm64
            goos: linux
            goarch: arm64
          - build: darwin-amd64
            goos: darwin
            goarch: amd64
          - build: darwin-arm64
            goos: darwin
            goarch: arm64
          - build: windows-amd64
            goos: windows
            goarch: amd64
          - build: windows-arm64
            goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go install -trimpath -ldflags="-s -w"
