name: ci

on:
  pull_request:
    branches: ["main"]

env:
  GO_VERSION: "1.27.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Format
        run: gofmt -s -w . && git diff --exit-code

      - name: Mod download
        run: go mod download

      - name: Tidy
        run: go mod tidy && git diff --exit-code

      - name: Mod verify
        run: go mod verify

      - name: Lint
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: "2026.2.1"
          install-go: false

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test
        run: go test -v -parallel 8 ./...

  test-windows:
    name: test (windows-latest)
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download fetch binary
        uses: actions/download-artifact@v8
        with:
          name: fetch-windows-amd64
          path: ${{ runner.temp }}

      - name: Test
        env:
          FETCH_INTEGRATION_BINARY: ${{ runner.temp }}\fetch.exe
        run: go test -v -parallel 8 ./...

  build-windows:
    name: build (windows-amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o fetch.exe

      - name: Upload fetch binary
        uses: actions/upload-artifact@v7
        with:
          name: fetch-windows-amd64
          path: fetch.exe
          if-no-files-found: error
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build:
          - linux-amd64
          - linux-arm64
          - darwin-amd64
          - darwin-arm64
          - windows-arm64
        include:
          - build: linux-amd64
            goos: linux
            goarch: amd64
          - build: linux-arm64
            goos: linux
            goarch: arm64
          - build: darwin-amd64
            goos: darwin
            goarch: amd64
          - build: darwin-arm64
            goos: darwin
            goarch: arm64
          - build: windows-arm64
            goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go install -trimpath -ldflags="-s -w"
